<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leps Localizer — TFJS browser demo</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <h1>Leps Localizer — TFJS</h1>
  <p class="sub">
    Same YOLO26-n model, TFJS runtime. Compare with
    <a href="index.html">ORT-web build</a>.
  </p>
</header>

<section id="controls">
  <div class="row">
    <label class="btn">
      <input type="file" id="file" accept="image/*" hidden />
      Pick image
    </label>
    <button id="webcam-btn" class="btn">Start webcam</button>
    <button id="stop-btn" class="btn" disabled>Stop</button>
    <span id="status">loading…</span>
  </div>
  <div class="row">
    <label>model
      <select id="model">
        <option value="uint8">yolo26n uint8 (1.6 MB wire)</option>
        <option value="fp16">yolo26n fp16 (4.0 MB wire)</option>
      </select>
    </label>
    <label>backend
      <select id="backend">
        <option value="webgl">webgl (GPU)</option>
        <option value="cpu">cpu</option>
      </select>
    </label>
  </div>
  <div class="row sliders">
    <label>conf
      <input type="range" id="conf" min="0" max="1" step="0.01" value="0.25" />
      <span id="conf-v">0.25</span>
    </label>
    <label>max det
      <input type="range" id="maxdet" min="1" max="300" step="1" value="100" />
      <span id="maxdet-v">100</span>
    </label>
  </div>
</section>

<section id="stage">
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <video id="cam" autoplay playsinline muted hidden></video>
  </div>
  <aside id="info">
    <div><b>Input</b>: <span id="meta-in">—</span></div>
    <div><b>Inference</b>: <span id="meta-ms">—</span></div>
    <div><b>Detections</b>: <span id="meta-n">—</span></div>
    <div><b>Backend</b>: <span id="meta-ep">—</span></div>
  </aside>
</section>

<footer>
  <p>
    TFJS path: graph model + sharded weights, Brotli-precompressed.
    Models served from <code>model/tfjs/&lt;variant&gt;/</code>.
  </p>
</footer>

<script src="tfjs.js"></script>
</body>
</html>
