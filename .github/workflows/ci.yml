name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Cache pre-commit hooks
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    # Lint only the files changed in the PR rather than the whole tree: the
    # repo predates this CI and still carries flake8 debt in older modules, so
    # `--all-files` would fail on unrelated code. pre-commit runs each hook in
    # its own isolated env, so this does not install the heavy project
    # dependencies (torch, etc.).
    - name: Run pre-commit on changed files
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ -n "$BASE_SHA" ]; then
          git fetch --depth=1 origin "$BASE_SHA"
          uvx pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
        else
          uvx pre-commit run --all-files --show-diff-on-failure
        fi

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --extra dev --extra research

    - name: Test CLI commands
      run: |
        uv run ami-dataset --help
        uv run ami-classification --help

    - name: Run test suite
      run: uv run pytest tests/ -v

    - name: Verify imports
      run: |
        uv run python -c "import torch; import numpy; import pandas; print('Core dependencies imported successfully')"

    - name: Verify optional dependencies (research)
      run: |
        uv run python -c "import awscli; import absl; print('Research dependencies imported successfully')"
