# SLURM configuration for local testing
# Based on DRAC/Compute Canada configuration
# See: https://docs.alliancecan.ca/wiki/Running_jobs

ClusterName=ami-ml-local
SlurmctldHost=slurmctld

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge

# Logging and accounting
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurm/d
StateSaveLocation=/var/spool/slurm/ctld

# Process tracking (similar to DRAC)
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Timers
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# Job submission
MaxJobCount=10000
MaxArraySize=1001

# Resource limits
# Match DRAC's approach to resource management
DefMemPerCPU=256
MaxMemPerCPU=0

# Fair share scheduling
PriorityType=priority/multifactor
PriorityDecayHalfLife=7-0
PriorityMaxAge=7-0
PriorityWeightAge=1000
PriorityWeightFairshare=10000
PriorityWeightJobSize=1000
PriorityWeightPartition=1000
PriorityWeightQOS=0

# Accounting
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

# Compute node configuration
# Single node with multiple CPUs and optional GPU
NodeName=c1 CPUs=8 RealMemory=32000 Gres=gpu:2 State=UNKNOWN

# Partition definitions (similar to DRAC partitions)
# main partition (default, similar to DRAC's compute)
PartitionName=main Nodes=c1 Default=YES MaxTime=48:00:00 State=UP

# long partition (for longer jobs, similar to DRAC's long partition)
PartitionName=long Nodes=c1 Default=NO MaxTime=INFINITE State=UP

# long-cpu partition (CPU only, similar to DRAC)
PartitionName=long-cpu Nodes=c1 Default=NO MaxTime=INFINITE State=UP

# GPU resource configuration
GresTypes=gpu
