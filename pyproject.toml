[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ami-ml"
version = "0.1.0"
description = "Software & research related to the automated monitoring of insects"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10,<3.15"
authors = [
    {name = "Aditya Jain", email = "aditya.jain@mila.quebec"},
    {name = "Michael Bunsen", email = "michael.bunsen@mila.quebec"},
    {name = "Fagner Cunha", email = "fagner.cunha@icomp.ufam.edu.br"},
    {name = "Léonard Pasi", email = "leonardpasi@gmail.com"},
]

dependencies = [
    "click>=8.1.6",
    "numpy>=1.25.1",
    "torch>=2.0,!=2.0.1",
    "tqdm>=4.65.0",
    "segment-anything>=1.0",
    "torchvision>=0.15.1,!=0.15.2",
    "torchmetrics>=0.11.4",
    "pillow>=10.0.0",
    "matplotlib>=3.7.2",
    "python-dwca-reader>=0.15.1",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "webdataset>=0.2.48",
    "timm>=0.9.8",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
    "wandb>=0.17.5",
    "pygbif>=0.6.5",
    "opencv-python>=4.11.0.86",
]

[project.optional-dependencies]
research = [
    "awscli>=1.33.44",
    "awscli-plugin-endpoint>=0.4",
    "absl-py>=2.1.0",
]
dev = [
    "pre-commit>=3.3.3",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "Flake8-pyproject>=1.2.3",
    "isort>=5.12.0",
    "mypy>=1.4.1",
    "ipdb>=0.13.13",
    "python-devtools>=2",
    "ipykernel>=6.29.4",
    "pytest>=8.1.1",
]
detection = [
    # Detector training stack for the Lepidoptera localizer
    # (research/leps_localizer/). torch, torchvision and wandb are already core
    # dependencies; this adds the YOLO-family and RT-DETR runtimes plus the
    # parquet and S3 readers used by the dataset adapter.
    "ultralytics>=8.3",
    "transformers>=4.45",
    "pyarrow>=17",
    "boto3>=1.35",
    "s3fs>=2024.10",
    "pycocotools>=2.0.7",
]
demo = [
    # Side-by-side model comparison app
    # (research/leps_localizer/scripts/serve_gym.py). Install `detection` too
    # to load the Ultralytics backends.
    "gradio>=4.44",
]
export-edge = [
    # Edge-format export for the localizer
    # (research/leps_localizer/scripts/export_model.py): CoreML, ONNX, TFLite
    # and TensorFlow.js toolchains. TensorFlow wheels lag new Python releases,
    # so tensorflow and tensorflowjs are limited to Python < 3.13; ONNX and
    # CoreML exports work on every supported version.
    "onnx>=1.16",
    "onnxslim>=0.1.34",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
    "coremltools>=7.2",
    "tensorflow>=2.16; python_version < '3.13'",
    "tensorflowjs>=4.20; python_version < '3.13'",
]

[project.scripts]
ami-dataset = "src.dataset_tools.cli:cli"
ami-classification = "src.classification.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flake8]
max-line-length = 88
ignore = ["E203", "E266", "E501", "W503"]
max-complexity = 25
per-file-ignores = [
    "__init__.py:F401",
    "src/localization/training.py:E402",
    "research/leps_localizer/scripts/validate_export.py:E231",
    "research/leps_localizer/scripts/quantize_onnx.py:E231",
    "research/leps_localizer/scripts/compress_onnx.py:E231",
    "research/leps_localizer/scripts/eval_onnx_recall.py:E231",
    "research/leps_localizer/scripts/eval_tflite_recall.py:E231",
    "research/leps_localizer/demo/serve.py:E231"
]
exclude = [
    ".git",
    "research/deprecated/*",
    "__pycache__"
]